[package]
name = "sol_mev_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana
solana-sdk = "1.18"
solana-client = "1.18"

# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "macros"] }
futures = "0.3"
futures-util = "0.3"

# HTTP/WebSocket
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
bs58 = "0.5"
base64 = "0.21"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
chrono = "0.4"

[[bin]]
name = "mev_bot"
path = "src/main.rs"

[[bin]]
name = "test_latency"
path = "src/bin/test_latency.rs"

[[bin]]
name = "monitor"
path = "src/bin/monitor.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
