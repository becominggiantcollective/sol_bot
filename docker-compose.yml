version: '3.8'

services:
  sniper-bot:
    build: .
    container_name: sol_sniper_bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY}
      - JUPITER_API_KEY=${JUPITER_API_KEY}
      - HELIUS_API_KEY=${HELIUS_API_KEY}
      - HELIUS_RPC_URL=${HELIUS_RPC_URL}
      - HELIUS_WS_URL=${HELIUS_WS_URL}
    volumes:
      # Mount entire directory for data persistence (more robust than individual files)
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sol_bot_network

  # Dashboard service - Terminal UI for monitoring
  dashboard:
    build: .
    container_name: sol_dashboard
    restart: unless-stopped
    command: ["node", "dashboard.mjs"]
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./positions-birdeye.json:/app/positions-birdeye.json
      - ./ml-model-v2.json:/app/ml-model-v2.json
    networks:
      - sol_bot_network
    depends_on:
      - sniper-bot

networks:
  sol_bot_network:
    driver: bridge
