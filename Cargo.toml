[package]
name = "sol_bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arb_engine"
path = "src/arb_engine.rs"

[[bin]]
name = "tx-executor"
path = "src/bin/tx-executor.rs"

[lib]
name = "sol_bot"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Solana core  
solana-client = "1.18"
solana-sdk = "1.18"
spl-token = "4.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP clients
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"
bs58 = "0.5"

# Error handling
anyhow = "1.0"

# Utilities
rayon = "1.8"
dashmap = "5.5"

# Numeric types
rust_decimal = "1.33"

# Node.js FFI (optional)
napi = { version = "2", optional = true, features = ["async", "napi8"] }
napi-derive = { version = "2", optional = true }

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true